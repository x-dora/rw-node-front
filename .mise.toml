[tools]
go = "1.24"

[env]
GOPROXY = "https://goproxy.cn,direct"

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run"

[tasks.test]
description = "Run Go tests"
run = "mise exec -- go test ./..."

[tasks.build]
description = "Build rw-node-front"
run = "go build -o bin/rw-node-front ."
